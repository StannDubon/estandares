<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Estándares de Enfermería</title>
<style>body{font:14px Arial,sans-serif;margin:0;background:#f4f6f8}main{padding:16px}nav{background:#1f4e79;color:#fff;padding:10px 16px;display:flex;gap:16px;align-items:center}
nav a,nav button{color:#fff;background:none;border:0;cursor:pointer;font:inherit;text-decoration:underline}.sp{flex:1}
table{border-collapse:collapse;background:#fff}th,td{border:1px solid #ccc;padding:4px;text-align:center}th{background:#dce6f1;font-size:12px}
input[type=number]{width:62px}.sc{overflow-x:auto}.f{background:#fff3cd;padding:8px;margin-bottom:10px}.pc{background:#eef5ea}button.b{padding:6px 12px}
form.i{display:contents}</style>
<nav><b>Estándares de Enfermería</b>{% if current_user.is_authenticated %}{% if current_user.is_admin %}<a href="{{url_for('admin')}}">Admin</a><a href="{{url_for('audit')}}">Historial</a>{% endif %}
<span class=sp></span>{{current_user.full_name}}<form method=post action="{{url_for('logout')}}"><input type=hidden name=_t value="{{T}}"><button>Salir</button></form>{% endif %}</nav>
<main>{% for m in get_flashed_messages() %}<div class=f>{{m}}</div>{% endfor %}{% block c %}{% endblock %}</main></html>
